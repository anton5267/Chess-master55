services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${CHESS_SQL_PASSWORD:-Chess_dev_2026!}"
    ports:
      - "14333:1433"
    volumes:
      - chess-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"; else /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\"; fi"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5000
      CONNECTION_STRING: "Server=sqlserver,1433;Database=Chess;User Id=sa;Password=${CHESS_SQL_PASSWORD:-Chess_dev_2026!};TrustServerCertificate=True;MultipleActiveResultSets=true"
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  chess-sql-data:
